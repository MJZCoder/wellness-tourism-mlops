name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "tourism_project/deployment/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  MLFLOW_ALLOW_FILE_STORE: 'true'

jobs:

  # -----------------------------------------
  # 1. Data Registration
  # -----------------------------------------
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements-ci.txt

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error

  # -----------------------------------------
  # 2. Data Preparation
  # -----------------------------------------
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements-ci.txt

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data/processed/train.csv
            tourism_project/data/processed/test.csv
          if-no-files-found: error

  # -----------------------------------------
  # 3. Model Training and MLflow Tracking
  # -----------------------------------------
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r tourism_project/requirements-ci.txt
          pip install mlflow

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/processed

      - name: Initialize Fresh MLflow Tracking
        run: |
          rm -rf tourism_project/mlruns
          mkdir -p tourism_project/mlruns

      - name: Train XGBoost Model
        run: python tourism_project/model_building/train.py

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            tourism_project/deployment/best_model.pkl
            tourism_project/deployment/features.json
            tourism_project/deployment/metrics.json
          if-no-files-found: error

  # -----------------------------------------
  # 4. Threshold Optimization
  # -----------------------------------------
  threshold-optimization:
    needs: model-training
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r tourism_project/requirements-ci.txt
          pip install mlflow

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/processed

      - name: Download Trained Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: tourism_project/deployment

      - name: Initialize Fresh MLflow Tracking
        run: |
          rm -rf tourism_project/mlruns
          mkdir -p tourism_project/mlruns

      - name: Optimize Classification Threshold
        run: python tourism_project/model_building/threshold_optimization.py

      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            tourism_project/deployment/best_model.pkl
            tourism_project/deployment/features.json
            tourism_project/deployment/metrics.json
            tourism_project/deployment/threshold.json
          if-no-files-found: error

      - name: Commit Deployment Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/

          if ! git diff --cached --quiet; then
            git commit -m "Update trained model and threshold [skip ci]"
            git push
          else
            echo "No deployment changes to commit"
          fi
